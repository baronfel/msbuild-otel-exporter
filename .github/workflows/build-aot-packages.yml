name: Build AOT packages

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-agnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Build RID-less AOT package
        run: |
          dotnet pack src/msbuild.otel.harness/msbuild.otel.harness.fsproj \
            /bl:pack-agnostic.binlog

      - name: Validate RID package mappings
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/package/release/*.nupkg)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected one RID-less package, but found ${#packages[@]}." >&2
            exit 1
          fi

          settings="$(unzip -p "${packages[0]}" tools/net10.0/any/DotnetToolSettings.xml)"
          for rid in linux-x64 linux-arm64 win-x64 win-arm64 osx-x64 osx-arm64; do
            mapping="RuntimeIdentifier=\"$rid\" Id=\"msbuild.otel.harness.$rid\""
            if ! grep -Fq "$mapping" <<< "$settings"; then
              echo "The RID-less package does not contain the expected $rid mapping." >&2
              exit 1
            fi
          done

      - name: Upload RID-less package
        uses: actions/upload-artifact@v4
        with:
          name: aot-packages-agnostic
          path: artifacts/package/release/*.nupkg
          retention-days: 30
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Install Linux ARM64 cross-compilation tools
        shell: bash
        run: |
          source /etc/os-release
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^Architectures:/d; /^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          cat <<EOF | sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources > /dev/null
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-backports
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: ${VERSION_CODENAME}-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install --yes clang llvm binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu zlib1g-dev zlib1g-dev:arm64

      - name: Build Linux AOT packages
        shell: bash
        run: |
          dotnet pack src/msbuild.otel.harness/msbuild.otel.harness.fsproj \
            --runtime linux-x64 \
            /bl:pack-linux-x64.binlog
          dotnet pack src/msbuild.otel.harness/msbuild.otel.harness.fsproj \
            --runtime linux-arm64 \
            /bl:pack-linux-arm64.binlog

      - name: Smoke test Linux AOT binlog ingestion
        shell: pwsh
        run: |
          $rid = "linux-$('${{ runner.arch }}'.ToLowerInvariant())"
          ./tests/NativeAotSmoke/Test-NativeAotBinlog.ps1 `
            -PackagePath (Get-Item "artifacts/package/release/*.$rid.*.nupkg") `
            -RuntimeIdentifier $rid

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: aot-packages-linux
          path: artifacts/package/release/*.nupkg
          retention-days: 30
          if-no-files-found: error

  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Build Windows AOT packages
        shell: pwsh
        run: |
          dotnet pack src/msbuild.otel.harness/msbuild.otel.harness.fsproj `
            --runtime win-x64 `
            /bl:pack-win-x64.binlog
          dotnet pack src/msbuild.otel.harness/msbuild.otel.harness.fsproj `
            --runtime win-arm64 `
            /bl:pack-win-arm64.binlog

      - name: Smoke test Windows AOT binlog ingestion
        shell: pwsh
        run: |
          $rid = "win-$('${{ runner.arch }}'.ToLowerInvariant())"
          ./tests/NativeAotSmoke/Test-NativeAotBinlog.ps1 `
            -PackagePath (Get-Item "artifacts/package/release/*.$rid.*.nupkg") `
            -RuntimeIdentifier $rid

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: aot-packages-windows
          path: artifacts/package/release/*.nupkg
          retention-days: 30
          if-no-files-found: error

  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Build macOS AOT packages
        shell: bash
        run: |
          dotnet pack src/msbuild.otel.harness/msbuild.otel.harness.fsproj \
            --runtime osx-x64 \
            /bl:pack-osx-x64.binlog
          dotnet pack src/msbuild.otel.harness/msbuild.otel.harness.fsproj \
            --runtime osx-arm64 \
            /bl:pack-osx-arm64.binlog

      - name: Smoke test macOS AOT binlog ingestion
        shell: pwsh
        run: |
          $rid = "osx-$('${{ runner.arch }}'.ToLowerInvariant())"
          ./tests/NativeAotSmoke/Test-NativeAotBinlog.ps1 `
            -PackagePath (Get-Item "artifacts/package/release/*.$rid.*.nupkg") `
            -RuntimeIdentifier $rid

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: aot-packages-macos
          path: artifacts/package/release/*.nupkg
          retention-days: 30
          if-no-files-found: error
